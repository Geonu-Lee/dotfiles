source-file ~/.config/tmux/tmux.reset.conf

# PATH 설정 (popup/run-shell에서 도구 찾을 수 있도록)
# $HOME 확장 위해 run-shell 사용 — Mac homebrew + Linux fzf install 모두 커버
run-shell 'tmux set-environment -g PATH "$HOME/.fzf/bin:$HOME/.local/bin:$HOME/.local/share/gem/ruby/3.0.0/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"'

set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g mouse on
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g prefix ^B

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g default-terminal "${TERM}"
setw -g mode-keys vi

# Dracula 색상 (수동)
set -g pane-active-border-style 'fg=#bd93f9,bg=default'
set -g pane-border-style 'fg=#44475a,bg=default'

# ============================================================================
# 상태바 (Dracula - 미니멀 & 세련)
# ============================================================================
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#282a36,fg=#f8f8f2'

# 왼쪽: 세션 (● 동그라미)
set -g status-left-length 40
set -g status-left '#[fg=#50fa7b,bold] ● #[fg=#bd93f9,bold]#S #[fg=#44475a,nobold]┃ '

# 윈도우 탭
set -g window-status-format '#[fg=#6272a4] #I·#W '
set -g window-status-current-format '#[fg=#ff79c6,bold] #I·#W#{?window_zoomed_flag, ⚡,} '
set -g window-status-separator '#[fg=#44475a]·'

# 오른쪽: 디렉토리 + 시간
set -g status-right-length 80
set -g status-right '#[fg=#8be9fd]#{b:pane_current_path} #[fg=#44475a]┃ #[fg=#f1fa8c,bold]%H:%M '

# ============================================================================
# TPM 플러그인
# ============================================================================
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-floax'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'

# ============================================================================
# 키바인딩 (화려 스타일 popup)
# ============================================================================
# SSH - Cyan 테두리
bind g display-popup -E -w 50% -h 60% -b rounded -s 'bg=#282a36' -S 'fg=#8be9fd,bg=#282a36,bold' -T '#[fg=#282a36,bg=#8be9fd,bold] 󰣀  SSH Hosts ' \
  "/bin/bash $HOME/.config/tmux/scripts/ssh-select.sh"

# Session - Purple 테두리
bind s display-popup -E -w 50% -h 50% -b rounded -s 'bg=#282a36' -S 'fg=#bd93f9,bg=#282a36,bold' -T '#[fg=#282a36,bg=#bd93f9,bold] 󰓩  Sessions ' \
  "tmux list-sessions -F '#{session_name}' | fzf \
    --prompt=' ❯ ' --pointer='▶' --marker='✓' \
    --border=none --height=100% --layout=reverse \
    --color='fg:#f8f8f2,bg:#282a36,hl:#bd93f9,fg+:#ffffff,bg+:#44475a,hl+:#ff79c6,info:#ffb86c,prompt:#50fa7b,pointer:#ff79c6,marker:#50fa7b,header:#6272a4' \
  | xargs -I {} tmux switch-client -t {}"

bind S command-prompt -p "New session:" "new-session -s '%%'"
bind x if-shell "[ #{window_panes} -eq 1 ]" "kill-window" "kill-pane"

# Workspace - Pink 테두리
bind w display-popup -E -w 50% -h 50% -b rounded -s 'bg=#282a36' -S 'fg=#ff79c6,bg=#282a36,bold' -T '#[fg=#282a36,bg=#ff79c6,bold] 󰏘  Workspaces ' \
  "/bin/bash $HOME/.config/tmux/scripts/tmuxinator-select.sh"

bind f new-window -n "yazi" "yazi"

run '~/.tmux/plugins/tpm/tpm'
