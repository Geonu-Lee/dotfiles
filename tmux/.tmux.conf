# ============================================================================
# tmux — 기본값을 그대로 쓴다.
#
# 키바인딩 재정의·상태바 커스텀·TPM 플러그인·fzf 팝업을 모두 걷어냈다.
# 기본 tmux 와 다른 점은 아래 셋뿐이고, prefix 도 기본 Ctrl+B 그대로다.
#
# 이전 구성(Dracula 상태바 + 플러그인 8종 + 팝업)이 필요하면:
#   git log --oneline -- tmux/   에서 이 커밋 직전 버전을 꺼낸다.
# ============================================================================

# 스크롤백 — 기본 2000 줄은 빌드 로그 하나에 밀려 사라진다
set -g history-limit 1000000

# 마우스 — 스크롤·pane 선택·크기 조절.
# 켜면 드래그가 tmux copy-mode 로 들어가므로, 터미널 네이티브 텍스트 선택은
# Option(⌥) 을 누른 채 드래그해야 한다.
set -g mouse on

# 클립보드 — set-clipboard 는 OSC 52 로 터미널에 넘기는데 Terminal.app 이 이를
# 지원하지 않아 시스템 클립보드까지 도달하지 못한다. pbcopy 로 직접 넘긴다.
# 기본 바인딩(드래그·더블클릭·트리플클릭·Enter)이 모두 인자 없는
# copy-pipe-and-cancel 이라, 이 한 줄로 전부 적용된다.
set -g copy-command 'pbcopy'
